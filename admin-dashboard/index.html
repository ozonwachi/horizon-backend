<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Fashion World</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --danger: #e5484d;
    --ok: #2fb36c;
    --warn: #e0a72d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  #app { max-width: 1000px; margin: 0 auto; padding: 24px 16px 80px; }
  .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    width: 100%;
    max-width: 380px;
  }
  .card h1 { font-size: 18px; margin: 0 0 4px; }
  .card p.sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
  button {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.full { width: 100%; margin-top: 18px; padding: 10px; }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  header.top .who { font-size: 12px; color: var(--muted); }
  nav.tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  nav.tabs button { background: var(--panel); }
  nav.tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  nav.tabs button { position: relative; }
  .tab-badge {
    display: inline-block; min-width: 16px; padding: 1px 5px; margin-left: 6px;
    background: var(--danger); color: #fff; border-radius: 999px;
    font-size: 10px; font-weight: 700; line-height: 1.4; vertical-align: middle;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .badge.pending { background: #3a3320; color: var(--warn); }
  .badge.approved { background: #1f2f45; color: var(--accent); }
  .badge.processing { background: #1f2f45; color: var(--accent); }
  .badge.paid { background: #163a29; color: var(--ok); }
  .badge.rejected { background: #3a1f22; color: var(--danger); }
  .badge.failed { background: #3a1f22; color: var(--danger); }
  .badge.low { background: #1f2f45; color: var(--accent); }
  .badge.medium { background: #3a3320; color: var(--warn); }
  .badge.high { background: #3a1f22; color: var(--danger); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; margin: 0 0 14px; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; max-width: 420px; width: 100%; }
  .modal h3 { margin: 0 0 14px; font-size: 15px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; font-size: 13px; z-index: 100;
  }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.ok { border-color: var(--ok); color: var(--ok); }
  .qr-box { background: #fff; padding: 12px; border-radius: 8px; display: inline-block; margin: 12px 0; }
  .chat-panel {
    position: fixed; right: 20px; bottom: 20px; width: 360px; max-width: calc(100vw - 40px);
    height: 480px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .chat-panel-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .chat-panel-messages { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  .chat-bubble { max-width: 80%; padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  .chat-bubble .who { font-size: 10px; font-weight: 700; text-transform: uppercase; opacity: .7; margin-bottom: 2px; }
  .chat-bubble.buyer { align-self: flex-start; background: var(--panel-2); }
  .chat-bubble.seller { align-self: flex-start; background: #2a2418; }
  .chat-bubble.admin { align-self: flex-end; background: var(--accent); color: #fff; }
  .chat-panel-input { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--border); }
  .chat-panel-input input { flex: 1; margin: 0; }
  .qr-box img { display: block; width: 180px; height: 180px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; color: var(--muted); }
  .staff-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .approvals-line { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>

<script>
// ---------------------------------------------------------------------------
// Fashion World staff dashboard. Private, unlinked, noindex - never bundled into
// the mobile app. Every real decision (who's admin, who's owner, MFA state)
// is enforced by the backend on every request; this page is just a thin
// client over supabase-js (auth/MFA) + the horizon-backend-fresh edge
// functions. No secrets live here - only the public anon key, same as the
// Flutter app ships with.
// ---------------------------------------------------------------------------

const SUPABASE_URL = "https://yphohlkfpaezuxcbxtnh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaG9obGtmcGFlenV4Y2J4dG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NDgzOTIsImV4cCI6MjEwMzIyNDM5Mn0.ZA0OFflXW0OYjzQwCwaQBtoWAJWy5TJVBnX9YlYHIVU";
const FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById("app");

const state = {
  view: "loading", // loading | login | mfa-enroll | mfa-challenge | dashboard
  tab: "withdrawals",
  session: null,
  isOwner: false,
  error: null,
  enroll: null, // { factorId, qrSvg, secret }
  challengeFactorId: null,
  withdrawals: [],
  approvalsByRequest: {}, // requestId -> [approvals]
  staff: [],
  settings: null,
  disputes: [],
  reports: [],
  verifications: [],
  verificationDetail: null, // { ...request, applicantName, frontUrl, backUrl, selfieUrl }
  contactFlags: [],
  deliveries: [],
  sosAlerts: [],
  sosFilter: "active",
  sosDetail: null,
  deliveryPhoto: null,
  banEvasionFlags: [],
  bannedPhones: [],
  categories: [],
  regions: [],
  faqs: [],
  contactMessages: [],
  offPlatformDeals: [],
  analytics: null,
  needsAttention: {},
  disputeCount: 0,
  auditLog: [],
  userSearchQuery: "",
  userSearchResults: [],
  listingsQuery: "",
  listingsTypes: new Set(["listing", "job", "barter"]),
  listingsResults: [],
  flaggedConversation: null, // { conversationId, relatedItemTitle, messages }
  postPreview: null, // { type, title, description, ownerName }
  evidenceByAgreement: {}, // agreementId -> { auditLog: [], conversation: null }
  chat: null, // { conversationId, agreementId, buyerId, sellerId, buyerName, sellerName, messages: [], channel }
  aiEnabled: false, // whether ANTHROPIC_API_KEY is set on the backend - see /ai/status
  aiSuggestionsByAgreement: {}, // agreementId -> [{ id, suggestion, model, createdAt }]
  aiSuggestBusy: {}, // agreementId -> true while a suggestion request is in flight
  aiFraudFlags: [],
  aiFraudScanBusy: false,
  logisticsApplications: [],
  busy: false,
};

function toNaira(kobo) {
  return "₦" + (Number(kobo || 0) / 100).toLocaleString("en-NG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let toastTimer = null;
function toast(message, kind) {
  clearTimeout(toastTimer);
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.className = "toast " + (kind || "");
  el.textContent = message;
  toastTimer = setTimeout(() => el.remove(), 4500);
}

async function apiFetch(path, options) {
  options = options || {};
  const { data } = await sb.auth.getSession();
  const token = data && data.session ? data.session.access_token : null;
  const res = await fetch(FUNCTIONS_BASE + path, {
    method: options.method || "GET",
    headers: Object.assign(
      {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + token,
      },
      options.headers || {}
    ),
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  let body = null;
  try { body = await res.json(); } catch (_) { /* no body */ }
  if (!res.ok) {
    const err = new Error((body && body.error) || ("Request failed (" + res.status + ")"));
    err.code = body && body.code;
    err.status = res.status;
    throw err;
  }
  return body;
}

// ---------------------------------------------------------------------------
// Auth / MFA
// ---------------------------------------------------------------------------

async function refreshAuthState() {
  const { data: sessionData } = await sb.auth.getSession();
  const session = sessionData && sessionData.session;
  if (!session) {
    state.view = "login";
    render();
    return;
  }
  state.session = session;

  const { data: aal, error: aalErr } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aalErr) { state.error = aalErr.message; state.view = "login"; render(); return; }

  if (aal.nextLevel === "aal2" && aal.currentLevel !== "aal2") {
    // A verified factor exists but this session hasn't stepped up yet.
    const { data: factorsData } = await sb.auth.mfa.listFactors();
    const factor = (factorsData && factorsData.totp && factorsData.totp[0]) || null;
    state.challengeFactorId = factor ? factor.id : null;
    state.view = "mfa-challenge";
    render();
    return;
  }

  const { data: factorsData2 } = await sb.auth.mfa.listFactors();
  const hasVerifiedFactor = factorsData2 && factorsData2.totp && factorsData2.totp.length > 0;
  if (!hasVerifiedFactor) {
    state.view = "mfa-enroll";
    render();
    return;
  }

  await enterDashboard();
}

async function enterDashboard() {
  state.view = "dashboard";
  // Owner-ness is whatever the backend says it is (staffRole via /admin/staff
  // will 403 for a worker) - we optimistically try it and fall back.
  try {
    await loadStaff();
    state.isOwner = true;
  } catch (_) {
    state.isOwner = false;
  }
  await loadWithdrawals();
  await refreshBadges();
  render();
}

async function doLogin(email, password) {
  state.busy = true; state.error = null; render();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  state.busy = false;
  if (error) { state.error = error.message; render(); return; }
  await refreshAuthState();
}

async function startEnroll() {
  state.busy = true; state.error = null; render();
  const { data, error } = await sb.auth.mfa.enroll({ factorType: "totp" });
  state.busy = false;
  if (error) { state.error = error.message; render(); return; }
  state.enroll = { factorId: data.id, qrSvg: data.totp.qr_code, secret: data.totp.secret };
  render();
}

async function verifyEnroll(code) {
  state.busy = true; state.error = null; render();
  const { data: ch, error: chErr } = await sb.auth.mfa.challenge({ factorId: state.enroll.factorId });
  if (chErr) { state.busy = false; state.error = chErr.message; render(); return; }
  const { error: vErr } = await sb.auth.mfa.verify({ factorId: state.enroll.factorId, challengeId: ch.id, code });
  state.busy = false;
  if (vErr) { state.error = vErr.message; render(); return; }
  state.enroll = null;
  await refreshAuthState();
}

async function verifyChallenge(code) {
  state.busy = true; state.error = null; render();
  const { data: ch, error: chErr } = await sb.auth.mfa.challenge({ factorId: state.challengeFactorId });
  if (chErr) { state.busy = false; state.error = chErr.message; render(); return; }
  const { error: vErr } = await sb.auth.mfa.verify({ factorId: state.challengeFactorId, challengeId: ch.id, code });
  state.busy = false;
  if (vErr) { state.error = vErr.message; render(); return; }
  await refreshAuthState();
}

async function signOut() {
  await sb.auth.signOut();
  Object.assign(state, { session: null, isOwner: false, withdrawals: [], staff: [], settings: null, view: "login" });
  render();
}

// ---------------------------------------------------------------------------
// Data loading
// ---------------------------------------------------------------------------

async function loadWithdrawals() {
  state.withdrawals = await apiFetch("/wallet/admin/withdrawals");
}

async function loadApprovals(requestId) {
  const approvals = await apiFetch("/wallet/admin/withdrawals/" + requestId + "/approvals");
  state.approvalsByRequest[requestId] = approvals;

}

async function loadDisputes() {

}

async function loadVerifications() {

async function loadSosAlerts() {
  const r = await apiFetch("/admin/sos?filter=" + encodeURIComponent(state.sosFilter));

}

async function openSosDetail(id) {
  try {
    state.sosDetail = await apiFetch("/admin/sos/" + id);
    render();
  } catch (e) {
    toast("Could not open alert: " + (e.message || e), "error");
  }
}

async function sosAction(id, action, note) {
  try {
    await apiFetch("/admin/sos/" + id + "/action", { method: "POST", body: JSON.stringify({ action, note }) });
    toast("Done", "ok");
    await loadSosAlerts();
    state.sosDetail = await apiFetch("/admin/sos/" + id);
    render();
  } catch (e) {
    toast(e.message || String(e), "error");
  }
}

async function sosRestrict(userId, restricted, reason, alertId) {
  try {
    await apiFetch("/admin/sos/restriction", { method: "POST", body: JSON.stringify({ userId, restricted, reason }) });
    toast(restricted ? "SOS access restricted" : "SOS access restored", "ok");
    if (alertId) state.sosDetail = await apiFetch("/admin/sos/" + alertId);
    render();
  } catch (e) {
    toast(e.message || String(e), "error");
  }
}

async function loadDeliveries() {
  const r = await apiFetch("/admin/deliveries");
  state.deliveries = r.deliveries || [];

async function loadContactFlags() {

async function loadAuditLog() {

// Profiles are publicly readable (same RLS the app's own admin user search
// relies on) - goes straight through the Supabase client, no backend route
// needed, exactly like AdminModerationService.searchUsers does in Flutter.
async function searchUsers(query) {
  const q = query.trim();
  if (!q) { state.userSearchResults = []; render(); return; }
  const { data, error } = await sb
    .from("profiles")
    .select("uid, name, username, email, account_status, trust_level")
    .or(`username_lower.ilike.%${q.toLowerCase()}%,name.ilike.%${q}%,email.ilike.%${q}%`)
    .limit(20);
  if (error) { toast(error.message, "error"); return; }
  state.userSearchResults = data || [];
  render();
}

// Listings/jobs/barter_posts are publicly readable - same direct-Postgrest
// pattern AdminListingsService.search uses in Flutter, not a backend route.
async function searchListings() {
  const q = state.listingsQuery.trim();
  const results = [];
  if (state.listingsTypes.has("listing")) {
    let b = sb.from("listings").select("id, title, description, owner_id, owner_name, created_at");
    if (q) b = b.or(`title.ilike.%${q}%,description.ilike.%${q}%`);
    const { data } = await b.order("created_at", { ascending: false }).limit(40);
    (data || []).forEach((r) => results.push({ id: r.id, type: "listing", title: r.title || "(untitled listing)", subtitle: "Listing · " + (r.owner_name || "Unknown"), createdAt: r.created_at }));
  }
  if (state.listingsTypes.has("job")) {
    let b = sb.from("jobs").select("id, title, description, poster_id, poster_name, is_service_offer, created_at");
    if (q) b = b.or(`title.ilike.%${q}%,description.ilike.%${q}%`);
    const { data } = await b.order("created_at", { ascending: false }).limit(40);
    (data || []).forEach((r) => results.push({ id: r.id, type: "job", title: r.title || "(untitled job)", subtitle: (r.is_service_offer ? "Service offer" : "Job") + " · " + (r.poster_name || "Unknown"), createdAt: r.created_at }));
  }
  if (state.listingsTypes.has("barter")) {
    let b = sb.from("barter_posts").select("id, offering, seeking, description, poster_id, poster_name, created_at");
    if (q) b = b.or(`offering.ilike.%${q}%,seeking.ilike.%${q}%,description.ilike.%${q}%`);
    const { data } = await b.order("created_at", { ascending: false }).limit(40);
    (data || []).forEach((r) => results.push({ id: r.id, type: "barter", title: (r.offering || "?") + " for " + (r.seeking || "?"), subtitle: "Barter · " + (r.poster_name || "Unknown"), createdAt: r.created_at }));
  }
  results.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  state.listingsResults = results;
  render();
}

// Listings/jobs/barter_posts are publicly readable - direct Postgrest read
// for a report's "jump to the post" link, same table access the app's own
// listing/job/barter detail screens already use.
async function loadPostPreview(type, id) {
  const table = type === "listing" ? "listings" : type === "job" ? "jobs" : "barter_posts";
  const { data, error } = await sb.from(table).select("*").eq("id", id).maybeSingle();
  if (error) { toast(error.message, "error"); return; }
  if (!data) { toast("Post not found - it may already be deleted.", "error"); return; }
  state.postPreview = {
    type,
    title: data.title || (data.offering ? `${data.offering} for ${data.seeking}` : "(untitled)"),
    description: data.description || "",
    ownerName: data.owner_name || data.poster_name || "",
  };
  render();
}

async function loadFlaggedConversation(flagId) {
  try {
    const fc = await apiFetch("/admin/contact-flags/" + flagId + "/conversation");
    const flag = (state.contactFlags || []).find((f) => f.id === flagId);
    state.flaggedConversation = { ...fc, matchedSnippet: flag ? flag.matchedSnippet : "" };
    render();
  } catch (e) {
    toast("Could not load conversation: " + (e.message || e), "error");
  }

// Powers the red count badges on tabs. Reuses get_platform_analytics()'s
// existing needsAttention object (already computed for the old Flutter
// admin analytics screen) rather than inventing new counting endpoints -
// only the dispute count has to be derived separately since disputes

async function loadAiStatus() {

    const s = await apiFetch("/ai/status");
    state.aiEnabled = Boolean(s && s.enabled);
  } catch (_) { /* non-fatal - AI features just stay hidden/disabled */ }

async function refreshBadges() {
  await loadAiStatus();
  try {
    const a = await apiFetch("/admin/analytics");
    state.needsAttention = a.needsAttention || {};
  } catch (_) { /* non-fatal - badges just stay at their last known value */ }
  try {
    const disputes = await apiFetch("/escrow/agreements/admin/all?status=disputed");
    state.disputeCount = disputes.reduce((n, a) => n + (a.tranches || []).filter((t) => t.status === "disputed").length, 0);
  } catch (_) { /* non-fatal */ }
}

function badgeCountFor(tabKey) {
  const n = state.needsAttention || {};
  switch (tabKey) {
    case "withdrawals": return n.pendingWithdrawals || 0;
    case "disputes": return state.disputeCount || 0;
    case "reports": return n.openReports || 0;
    case "verification": return n.pendingVerifications || 0;
    case "contactFlags": return n.openContactShareFlags || 0;
    case "banEvasion": return n.openBanEvasionFlags || 0;
    case "contactMessages": return n.openAdminContactMessages || 0;
    case "offPlatformDeals": return n.openOffPlatformDealReports || 0;
    default: return 0;
  }
}

// ---------------------------------------------------------------------------
// Deal Support Chat - the live three-way buyer/seller/admin thread. Unlike
// everything else in this dashboard, this writes straight to Postgres via
// the admin's own authenticated session (not through an edge function) -
// that's exactly how the Flutter app does it too (see MessageService in
// marketplace_app), relying on the same "is_support_conversation" RLS
// carve-out that already lets any admin into a deal's support thread.
// Conversation id formula MUST match escrowConversationId() on the backend
// and MessageService._conversationId() in Flutter exactly, or this looks up
// the wrong (or a duplicate) conversation.
// ---------------------------------------------------------------------------

function escrowConversationId(buyerId, sellerId, agreementId) {
  const sorted = [buyerId, sellerId].sort();
  return `${sorted[0]}_${sorted[1]}_escrow_${agreementId}`;
}

async function openChat(agreementId, buyerId, sellerId, buyerName, sellerName) {
  const conversationId = escrowConversationId(buyerId, sellerId, agreementId);
  const myUid = state.session.user.id;
  const myName = state.session.user.email;

  const { data: existing, error: existingErr } = await sb.from("conversations").select("id").eq("id", conversationId).maybeSingle();
  if (existingErr) { toast(existingErr.message, "error"); return; }
  if (!existing) {
    const sortedIds = [buyerId, sellerId].sort();
    const { error: insertErr } = await sb.from("conversations").insert({
      id: conversationId,
      participant_ids: sortedIds,
      participant_names: { [buyerId]: buyerName, [sellerId]: sellerName },
      last_message: "",
      last_message_sender_id: null,
      related_item_type: "escrow",
      related_item_id: agreementId,
      related_item_title: "Deal support",
      is_support_conversation: true,
    });
    if (insertErr) { toast(insertErr.message, "error"); return; }
  }

  const { data: msgRows, error: msgErr } = await sb.from("messages").select("id, sender_id, text, sent_at, sender_role").eq("conversation_id", conversationId).order("sent_at", { ascending: true });
  if (msgErr) { toast(msgErr.message, "error"); return; }

  closeChat();
  state.chat = { conversationId, agreementId, buyerId, sellerId, buyerName, sellerName, myUid, myName, messages: msgRows || [] };
  render();

  state.chat.channel = sb
    .channel("chat-" + conversationId)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "conversation_id=eq." + conversationId }, (payload) => {
      if (!state.chat || state.chat.conversationId !== conversationId) return;
      state.chat.messages.push(payload.new);
      render();
    })
    .subscribe();
}

function closeChat() {
  if (state.chat && state.chat.channel) sb.removeChannel(state.chat.channel);
  state.chat = null;
}

async function sendChatMessage(text) {
  const trimmed = (text || "").trim();
  if (!trimmed || !state.chat) return;
  const { conversationId, myUid } = state.chat;
  const { error: insertErr } = await sb.from("messages").insert({
    conversation_id: conversationId, sender_id: myUid, text: trimmed, sender_role: "admin",
  });
  if (insertErr) { toast(insertErr.message, "error"); return; }
  await sb.from("conversations").update({ last_message: trimmed, last_message_sender_id: myUid, last_message_at: new Date().toISOString() }).eq("id", conversationId);
  // Fire-and-forget notify, matching MessageService.notifyNewMessage - tells
  // the buyer/seller a message arrived, and runs the contact-share heuristic.
  apiFetch("/conversations/" + conversationId + "/notify", { method: "POST", body: { text: trimmed } }).catch(() => {});
}

let modalState = null; // { title, fields: [{name,label,type}], onSubmit(values) }

function openModal(cfg) { modalState = cfg; render(); }
function closeModal() { modalState = null; render(); }

function renderModal() {
  if (!modalState) return "";
  const fieldsHtml = modalState.fields.map((f) => {
    if (f.type === "select") {
      const opts = f.options.map((o) => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join("");
      return `<label>${escapeHtml(f.label)}</label><select data-field="${f.name}">${opts}</select>`;
    }
    return `<label>${escapeHtml(f.label)}</label><input data-field="${f.name}" type="${f.type === "user-email" ? "email" : "text"}" placeholder="${escapeHtml(f.placeholder || "")}" />`;
  }).join("");
  return `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h3>${escapeHtml(modalState.title)}</h3>
        ${fieldsHtml}
        <div class="error" id="modal-error"></div>
        <div class="actions">
          <button id="modal-cancel">Cancel</button>
          <button class="primary" id="modal-submit">${escapeHtml(modalState.submitLabel || "Submit")}</button>
        </div>
      </div>
    </div>`;
}

function wireModal() {
  const backdrop = document.getElementById("modal-backdrop");
  if (!backdrop) return;
  document.getElementById("modal-cancel").onclick = closeModal;
  document.getElementById("modal-submit").onclick = async () => {
    const values = {};
    modalState.fields.forEach((f) => {
      values[f.name] = document.querySelector(`[data-field="${f.name}"]`).value;
    });
    try {
      for (const f of modalState.fields) {
        if (f.type === "user-email" && values[f.name]) {
          const user = await findUserByEmail(values[f.name]);
          values[f.name] = user.uid;
        }
      }
      await modalState.onSubmit(values);
      closeModal();
    } catch (e) {
      document.getElementById("modal-error").textContent = e.message;
    }
  };
}

function renderChatPanel() {
  if (!state.chat) return "";
  const c = state.chat;
  const bubbles = c.messages.map((m) => {
    const role = m.sender_role || (m.sender_id === c.buyerId ? "buyer" : m.sender_id === c.sellerId ? "seller" : "admin");
    const who = role === "buyer" ? c.buyerName : role === "seller" ? c.sellerName : "Admin";
    return `<div class="chat-bubble ${escapeHtml(role)}"><div class="who">${escapeHtml(who)}</div>${escapeHtml(m.text)}</div>`;
  }).join("");
  return `
    <div class="chat-panel">
      <div class="chat-panel-header">
        <strong>Deal Support Chat</strong>
        <button id="chat-close-btn">✕</button>
      </div>
      <div class="chat-panel-messages" id="chat-messages">${bubbles || `<div class="muted">No messages yet.</div>`}</div>
      <div class="chat-panel-input">
        <input id="chat-input" type="text" placeholder="Message buyer and seller..." />
        <button class="primary" id="chat-send-btn">Send</button>
      </div>
    </div>`;
}

function wireChatPanel() {
  const closeBtn = document.getElementById("chat-close-btn");
  if (closeBtn) closeBtn.onclick = () => { closeChat(); render(); };
  const sendBtn = document.getElementById("chat-send-btn");
  const input = document.getElementById("chat-input");
  if (sendBtn && input) {
    const send = async () => { const v = input.value; input.value = ""; await sendChatMessage(v); };
    sendBtn.onclick = send;
    input.onkeydown = (ev) => { if (ev.key === "Enter") send(); };
  }
  const messagesEl = document.getElementById("chat-messages");
  if (messagesEl) messagesEl.scrollTop = messagesEl.scrollHeight;
}

    <div class="center-screen">
      <div class="card">
        <h1>Two-factor verification</h1>
        <p class="sub">Enter the 6-digit code from your authenticator app.</p>
        <label>Code</label>
        <input id="mfa-code" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
        <button class="primary full" id="verify-btn" ${state.busy ? "disabled" : ""}>${state.busy ? "Verifying..." : "Verify"}</button>
        <div class="error">${escapeHtml(state.error || "")}</div>
        <div class="hint"><a href="#" id="signout-link" style="color:var(--muted)">Sign out</a></div>
      </div>
    </div>`;
  document.getElementById("verify-btn").onclick = () => verifyChallenge(document.getElementById("mfa-code").value.trim());

function statusBadge(status) {
  return `<span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span>`;
}

function renderWithdrawalRow(w) {
  const approvals = state.approvalsByRequest[w.id];
  let approvalsLine = "";
  if (w.status === "pending" || w.status === "approved") {
    approvalsLine = approvals
      ? `<div class="approvals-line">Approvals: ${approvals.map((a) => a.approverRole).join(", ") || "none yet"} <a href="#" data-refresh-approvals="${w.id}">refresh</a></div>`
      : `<div class="approvals-line"><a href="#" data-load-approvals="${w.id}">show approvals</a></div>`;
  }

  let actions = "";
  if (w.status === "pending") {
    actions = `
      <button class="ok" data-approve="${w.id}">Approve</button>
      <button class="danger" data-reject="${w.id}">Reject</button>`;
  } else if (w.status === "approved") {
    actions = `
      <button class="ok" data-exec-manual="${w.id}">Execute (manual)</button>
      <button data-exec-auto="${w.id}">Execute (automatic)</button>
      <button class="danger" data-reject="${w.id}">Reject</button>`;
  } else if (w.status === "processing") {
    actions = `<span class="muted">Awaiting Paystack confirmation...</span>`;
  }

  return `
    <tr>
      <td>
        <div>${toNaira(w.amountKobo)}</div>
        <div class="muted">${escapeHtml(w.accountName)} · ${escapeHtml(w.bankName)}</div>
        <div class="muted">${escapeHtml(w.accountNumber)}</div>
      </td>
      <td>${statusBadge(w.status)}${w.rejectionReason ? `<div class="muted" style="margin-top:4px">${escapeHtml(w.rejectionReason)}</div>` : ""}</td>
      <td class="muted">${new Date(w.createdAt).toLocaleString()}</td>
      <td>
        <div class="row-actions">${actions}</div>
        ${approvalsLine}
      </td>
    </tr>`;
}

function renderEvidence(agreementId) {
  const ev = state.evidenceByAgreement[agreementId];
  if (!ev) return `<a href="#" data-load-evidence="${agreementId}">Load evidence (admin history + buyer/seller conversation)</a>`;
  const logRows = (ev.auditLog || []).map((e) => `
    <div class="approvals-line">${new Date(e.createdAt).toLocaleString()} · ${escapeHtml(e.action)}${e.reason ? " - " + escapeHtml(e.reason) : ""}</div>`).join("") || `<div class="muted">No admin actions on this deal yet.</div>`;
  const convo = ev.conversation;
  const msgRows = convo && convo.exists
    ? (convo.messages || []).map((m) => `<div class="approvals-line"><strong>${escapeHtml(convo.participantNames?.[m.senderId] || m.senderId)}:</strong> ${escapeHtml(m.text)}</div>`).join("")
    : `<div class="muted">No buyer/seller conversation on this deal.</div>`;
  return `
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      <div class="muted" style="font-weight:600;margin-bottom:4px">Admin actions</div>
      ${logRows}
      <div class="muted" style="font-weight:600;margin:8px 0 4px">Buyer/seller conversation</div>
      ${msgRows}
      ${renderAiSuggestions(agreementId)}
    </div>`;
}

// AI dispute triage - purely advisory (see _shared/aiService.ts's doc
// comment): a suggestion the admin can read before deciding, never a
// decision made for them. Hidden entirely when AI isn't turned on
// (ANTHROPIC_API_KEY not set) rather than showing a button that would just
// error.
function renderAiSuggestions(agreementId) {
  if (!state.aiEnabled) return "";
  const suggestions = state.aiSuggestionsByAgreement[agreementId] || [];
  const busy = state.aiSuggestBusy[agreementId];
  const rows = suggestions.map((s) => `
    <div class="approvals-line" style="white-space:pre-wrap">
      <span class="muted">${new Date(s.createdAt).toLocaleString()} · ${escapeHtml(s.model)}</span><br/>
      ${escapeHtml(s.suggestion)}
    </div>`).join("");
  return `
    <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)">
      <div class="muted" style="font-weight:600;margin-bottom:4px">AI suggestion (advisory only - verify before acting)</div>
      ${rows}
      <button data-ai-suggest="${agreementId}" ${busy ? "disabled" : ""}>${busy ? "Thinking..." : (suggestions.length ? "Ask again" : "Ask AI for a suggestion")}</button>
    </div>`;
}

async function askAiForDisputeSuggestion(agreementId) {
  state.aiSuggestBusy[agreementId] = true;
  render();
  try {
    const result = await apiFetch("/ai/dispute-triage", { method: "POST", body: { agreementId } });
    if (result.enabled === false) {
      toast("AI assistance isn't turned on yet.", "error");
    } else {
      const list = state.aiSuggestionsByAgreement[agreementId] || [];
      list.unshift({ id: result.id, suggestion: result.suggestion, model: result.model, createdAt: result.createdAt });
      state.aiSuggestionsByAgreement[agreementId] = list;
    }
  } catch (e) {
    toast(e.message, "error");
  } finally {
    state.aiSuggestBusy[agreementId] = false;
    render();
  }
}

// AI fraud flagging - see _shared/aiService.ts's doc comment. Purely
// report-only: the AI never bans/removes/changes anything itself, it only
// writes a flag here for an admin to look at and act on (or dismiss) using
// the same Moderation/Reports tools already on this dashboard. Scans are
// admin-triggered (the "Run fraud scan" button), never scheduled, so the
// (paid, once enabled) API cost stays under the admin's control.
function renderAiFlags() {
  if (!state.aiEnabled) {
    return `
      <div class="panel">
        <h2>AI Flags</h2>
        <p class="muted">AI assistance isn't turned on yet - set ANTHROPIC_API_KEY as a backend secret to enable dispute triage, fraud scanning, and the other AI features.</p>
      </div>`;
  }
  const rows = state.aiFraudFlags.map((f) => `
    <tr>
      <td>${escapeHtml(f.subject_type)}<div class="muted">${escapeHtml(f.subject_id)}</div></td>
      <td>${escapeHtml(f.reason)}</td>
      <td><span class="badge ${escapeHtml(f.severity)}">${escapeHtml(f.severity)}</span></td>
      <td class="muted">${new Date(f.created_at).toLocaleString()}</td>
      <td class="row-actions">
        ${f.subject_type === "listing" ? `<a href="#" data-view-post="listing|${f.subject_id}">View post</a>` : ""}
        ${f.resolved
          ? `<span class="muted">resolved${f.resolution_note ? " - " + escapeHtml(f.resolution_note) : ""}</span>`
          : `<button data-resolve-flag="${f.id}">Mark reviewed</button>`}
      </td>
    </tr>`).join("");
  return `
    ${renderPostPreview()}
    <div class="panel">
      <h2>AI Flags</h2>
      <p class="muted">Suspicious listings the AI has flagged for review - advisory only, nothing here has been acted on automatically.</p>
      <button data-run-fraud-scan ${state.aiFraudScanBusy ? "disabled" : ""}>${state.aiFraudScanBusy ? "Scanning..." : "Run fraud scan"}</button>
      <table style="margin-top:12px">
        <thead><tr><th>Subject</th><th>Reason</th><th>Severity</th><th>Flagged</th><th>Actions</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" class="muted">No unresolved flags.</td></tr>`}</tbody>
      </table>
    </div>`;
}

async function loadAiFraudFlags() {
  await loadAiStatus();
  if (!state.aiEnabled) { state.aiFraudFlags = []; return; }
  try {
    state.aiFraudFlags = await apiFetch("/ai/fraud-flags?resolved=false");
  } catch (e) {
    toast(e.message, "error");
  }
}

async function runFraudScan() {
  state.aiFraudScanBusy = true;
  render();
  try {
    const result = await apiFetch("/ai/fraud-scan", { method: "POST" });
    if (result.enabled === false) {
      toast("AI assistance isn't turned on yet.", "error");
    } else if ((result.flags || []).length === 0) {
      toast("Scan complete - nothing suspicious found.", "ok");
    } else {
      toast(`Scan complete - ${result.flags.length} listing(s) flagged.`, "ok");
    }
    await loadAiFraudFlags();
  } catch (e) {
    toast(e.message, "error");
  } finally {
    state.aiFraudScanBusy = false;
    render();
  }
}

async function resolveFraudFlag(id, note) {
  try {
    await apiFetch(`/ai/fraud-flags/${id}/resolve`, { method: "POST", body: { note } });
    await loadAiFraudFlags();
    render();
  } catch (e) {
    toast(e.message, "error");
  }
}

function wireAiFlagsActions() {
  const scanBtn = document.querySelector("[data-run-fraud-scan]");
  if (scanBtn) scanBtn.onclick = runFraudScan;
  document.querySelectorAll("[data-resolve-flag]").forEach((b) => {
    b.onclick = () => openModal({
      title: "Mark flag reviewed",
      fields: [{ name: "note", label: "Note (optional)", placeholder: "What did you find/do?" }],
      submitLabel: "Mark reviewed",
      onSubmit: (v) => resolveFraudFlag(b.dataset.resolveFlag, v.note),
    });
  });
}

function renderFlaggedConversation() {
  const fc = state.flaggedConversation;
  if (!fc) return "";
  const snip = (fc.matchedSnippet || "").trim();
  const line = (m, highlight) => {
    const hit = highlight && snip && String(m.text || "").includes(snip);
    const when = m.sentAt ? new Date(m.sentAt).toLocaleString() : "";
    return `<div class="approvals-line" style="${hit ? "background:rgba(255,80,80,.15);border-left:3px solid var(--danger);padding-left:8px;" : ""}">
      <strong>${escapeHtml(m.senderName || "")}:</strong> ${escapeHtml(m.text || "")}
      <div class="muted" style="font-size:11px">${escapeHtml(when)}${hit ? " - flagged message" : ""}</div></div>`;
  };
  const main = (fc.messages || []).map((m) => line(m, true)).join("") || `<div class="muted">No messages.</div>`;
  const who = (fc.participants || []).map((p) => escapeHtml(p.name)).join(" and ");
  const others = (fc.otherThreads || []).map((t) => `
    <div class="muted" style="font-weight:600;margin:14px 0 4px">${escapeHtml(t.relatedItemTitle || "Another conversation")}</div>
    ${t.messages.map((m) => line(m, true)).join("")}`).join("");
  return `
    <div class="modal-backdrop" id="flagged-backdrop">
      <div class="modal" style="max-width:640px;max-height:85vh;overflow:auto">
        <h3>Flagged conversation${fc.relatedItemTitle ? " - " + escapeHtml(fc.relatedItemTitle) : ""}</h3>
        ${who ? `<div class="muted" style="margin-bottom:8px">Between ${who}</div>` : ""}
        ${main}
        ${others ? `<h3 style="margin-top:18px">Everything else they have said to each other</h3>${others}` : `<div class="muted" style="margin-top:14px">These two people have no other conversations on Horizon.</div>`}
        <div class="actions"><button id="close-flagged-conversation">Close</button></div>
      </div>
    </div>`;
}

function renderDashboard() {
  const visible = TAB_CONFIG.filter((t) => !t.ownerOnly || state.isOwner);
  const active = visible.find((t) => t.key === state.tab) || visible[0];
  const content = active.render();

  app.innerHTML = `
    <header class="top">
      <div>
        <strong>Fashion World</strong>
        <div class="who">${escapeHtml(state.session.user.email)} · ${state.isOwner ? "owner" : "worker"}</div>
      </div>
      <button id="signout-btn">Sign out</button>
    </header>
    <nav class="tabs">
      ${visible.map((t) => {
        const count = badgeCountFor(t.key);
        return `<button data-tab="${t.key}" class="${state.tab === t.key ? "active" : ""}">${escapeHtml(t.label)}${count > 0 ? `<span class="tab-badge">${count > 99 ? "99+" : count}</span>` : ""}</button>`;
      }).join("")}
    </nav>
    <div id="tab-content">${content}</div>
    ${renderModal()}
    ${renderChatPanel()}
  `;

  document.getElementById("signout-btn").onclick = signOut;
  document.querySelectorAll("[data-tab]").forEach((btn) => {
    btn.onclick = async () => {
      state.tab = btn.dataset.tab;
      const tabCfg = TAB_CONFIG.find((t) => t.key === state.tab);
      if (tabCfg && tabCfg.load) {
        try { await tabCfg.load(); } catch (e) { toast(e.message, "error"); }
      }
      render();
    };
  });

  wireWithdrawalActions();
  wireStaffActions();
  wireSettingsActions();
  wireDisputeActions();
  wireAiFlagsActions();
  wireReportActions();
  wireModerationActions();
  wireVerificationActions();
  wireLogisticsActions();
  wireContactFlagActions();
  wireBanEvasionActions();
  wireCategoryActions();
  wireRegionActions();
  wireFaqActions();
  wireContactMessageActions();
  wireOffPlatformDealActions();
  wireToolsActions();
  wireListingsActions();
  wireModal();
  wireChatPanel();
  wireDeliveryActions();
  wireSosActions();
}

function wireWithdrawalActions() {
  document.querySelectorAll("[data-approve]").forEach((btn) => {
    btn.onclick = () => approveWithdrawal(btn.dataset.approve);
  });
  document.querySelectorAll("[data-reject]").forEach((btn) => {
    btn.onclick = () => openModal({
      title: "Reject withdrawal",
      fields: [{ name: "reason", label: "Reason", placeholder: "Why is this being rejected?" }],
      submitLabel: "Reject",
      onSubmit: (v) => rejectWithdrawal(btn.dataset.reject, v.reason),
    });
  });
  document.querySelectorAll("[data-exec-manual]").forEach((btn) => {
    btn.onclick = () => openModal({
      title: "Execute manually",
      fields: [{ name: "reference", label: "Reference / note", placeholder: "e.g. bank transfer ref" }],
      submitLabel: "Mark paid",
      onSubmit: (v) => executeManual(btn.dataset.execManual, v.reference),
    });
  });
  document.querySelectorAll("[data-exec-auto]").forEach((btn) => {
    btn.onclick = async () => {
      let banks = [];
      try { banks = await apiFetch("/wallet/admin/banks"); } catch (e) { toast(e.message, "error"); return; }
      openModal({
        title: "Execute automatically via Paystack",
        fields: [{
          name: "bankCode", label: "Confirm the real bank (never auto-matched)", type: "select",
          options: banks.map((b) => ({ value: b.code, label: b.name })),
        }],
        submitLabel: "Start transfer",
        onSubmit: (v) => executeAutomatic(btn.dataset.execAuto, v.bankCode),
      });
    };
  });
  document.querySelectorAll("[data-load-approvals]").forEach((btn) => {
    btn.onclick = (ev) => { ev.preventDefault(); loadApprovals(btn.dataset.loadApprovals); };
  });
  document.querySelectorAll("[data-refresh-approvals]").forEach((btn) => {
    btn.onclick = (ev) => { ev.preventDefault(); loadApprovals(btn.dataset.refreshApprovals); };
  });
}

function wireStaffActions() {
  document.querySelectorAll("[data-revoke-staff]").forEach((btn) => {
    btn.onclick = () => { if (confirm("Revoke staff access for this account?")) revokeStaff(btn.dataset.revokeStaff); };
  });
  const grantBtn = document.getElementById("grant-staff-btn");
  if (grantBtn) grantBtn.onclick = () => openModal({
    title: "Grant staff access",
    fields: [
      { name: "uid", label: "User email", type: "user-email", placeholder: "user@example.com" },
      { name: "role", label: "Role", type: "select", options: [{ value: "worker", label: "Worker" }, { value: "admin", label: "Owner" }] },
    ],
    submitLabel: "Grant",
    onSubmit: (v) => grantStaff(v.uid, v.role),
  });
}

function wireSettingsActions() {
  const btn = document.getElementById("save-threshold-btn");
  if (btn) btn.onclick = () => updateThreshold(document.getElementById("threshold-input").value);

  const psBtn = document.getElementById("save-platform-settings-btn");
  if (psBtn) psBtn.onclick = () => updatePlatformSettings({
    adminCommissionType: document.getElementById("admin-commission-type").value,
    adminCommissionValue: Number(document.getElementById("admin-commission-value").value),
    referralCommissionType: document.getElementById("referral-commission-type").value,
    referralCommissionValue: Number(document.getElementById("referral-commission-value").value),
    referralMaxPayoutsPerReferredUser: Number(document.getElementById("referral-max-payouts").value),
    connectionFeeType: document.getElementById("connection-fee-type").value,
    connectionFeeValue: Number(document.getElementById("connection-fee-value").value),
  });

  document.querySelectorAll("[data-save-rule-value]").forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.saveRuleValue;
      const value = Number(document.querySelector(`[data-rule-value="${id}"]`).value);
      upsertCommissionRule({
        type: b.dataset.ruleType,
        category: b.dataset.ruleCategory || null,
        mode: b.dataset.ruleMode,
        value,
        minKobo: b.dataset.ruleMin ? Number(b.dataset.ruleMin) : null,
        maxKobo: b.dataset.ruleMax ? Number(b.dataset.ruleMax) : null,
      });
    };
  });
  document.querySelectorAll("[data-delete-rule]").forEach((b) => {
    b.onclick = () => { if (confirm("Delete this commission rule?")) deleteCommissionRule(b.dataset.deleteRule); };
  });
  const newRuleBtn = document.getElementById("new-commission-rule-btn");
  if (newRuleBtn) newRuleBtn.onclick = () => openModal({
    title: "New commission rule",
    fields: [
      { name: "type", label: "Type", type: "select", options: [{ value: "listing", label: "Listing" }, { value: "job", label: "Job" }, { value: "barter", label: "Barter" }, { value: "custom", label: "Custom" }] },
      { name: "category", label: "Category (blank = default for type)" },
      { name: "mode", label: "Mode", type: "select", options: [{ value: "flat", label: "Flat" }, { value: "percentage", label: "Percentage" }] },
      { name: "value", label: "Value" },
      { name: "minKobo", label: "Min (₦, optional)" },
      { name: "maxKobo", label: "Max (₦, optional)" },
    ],
    submitLabel: "Create",
    onSubmit: (v) => upsertCommissionRule({
      type: v.type, category: v.category || null, mode: v.mode, value: Number(v.value),
      minKobo: v.minKobo ? Math.round(Number(v.minKobo) * 100) : null,
      maxKobo: v.maxKobo ? Math.round(Number(v.maxKobo) * 100) : null,
    }),
  });

  document.querySelectorAll("[data-delete-tier]").forEach((b) => {
    b.onclick = () => { if (confirm("Delete this commission tier?")) deleteCommissionTier(b.dataset.deleteTier); };
  });
  const newTierBtn = document.getElementById("new-commission-tier-btn");
  if (newTierBtn) newTierBtn.onclick = () => openModal({
    title: "New commission tier",
    fields: [
      { name: "type", label: "Type", type: "select", options: [{ value: "listing", label: "Listing" }, { value: "job", label: "Job" }, { value: "barter", label: "Barter" }, { value: "custom", label: "Custom" }] },
      { name: "category", label: "Category (blank = default for type)" },
      { name: "minAmountKobo", label: "Min amount (₦)" },
      { name: "maxAmountKobo", label: "Max amount (₦, blank = no upper bound)" },
      { name: "mode", label: "Mode", type: "select", options: [{ value: "flat", label: "Flat" }, { value: "percentage", label: "Percentage" }] },
      { name: "value", label: "Value" },
    ],
    submitLabel: "Create",
    onSubmit: (v) => createCommissionTier({
      type: v.type, category: v.category || null,
      minAmountKobo: Math.round(Number(v.minAmountKobo) * 100),
      maxAmountKobo: v.maxAmountKobo ? Math.round(Number(v.maxAmountKobo) * 100) : null,
      mode: v.mode, value: Number(v.value),
    }),
  });
}

function wireDisputeActions() {
  document.querySelectorAll("[data-resolve-release]").forEach((b) => {
    b.onclick = () => {
      const [agreementId, trancheId] = b.dataset.resolveRelease.split("|");
      openModal({
        title: "Release to seller",
        fields: [{ name: "reason", label: "Reason (optional)" }],
        submitLabel: "Release",
        onSubmit: (v) => resolveDispute(agreementId, trancheId, "release", v.reason),
      });
    };
  });
  document.querySelectorAll("[data-resolve-refund]").forEach((b) => {
    b.onclick = () => {
      const [agreementId, trancheId] = b.dataset.resolveRefund.split("|");
      openModal({
        title: "Refund buyer",
        fields: [{ name: "reason", label: "Reason (optional)" }],
        submitLabel: "Refund",
        onSubmit: (v) => resolveDispute(agreementId, trancheId, "refund", v.reason),
      });
    };
  });
  document.querySelectorAll("[data-load-evidence]").forEach((a) => {
    a.onclick = (ev) => { ev.preventDefault(); loadEvidence(a.dataset.loadEvidence); };
  });
  document.querySelectorAll("[data-ai-suggest]").forEach((b) => {
    b.onclick = () => askAiForDisputeSuggestion(b.dataset.aiSuggest);
  });
  document.querySelectorAll("[data-open-chat]").forEach((b) => {
    b.onclick = async () => {
      const [agreementId, buyerId, sellerId] = b.dataset.openChat.split("|");
      const { data: profiles } = await sb.from("profiles").select("uid, name").in("uid", [buyerId, sellerId]);
      const nameOf = (uid) => (profiles || []).find((p) => p.uid === uid)?.name || uid;
      await openChat(agreementId, buyerId, sellerId, nameOf(buyerId), nameOf(sellerId));
    };
  });
}

}

function wireModerationActions() {
  const searchInput = document.getElementById("user-search-input");

    searchInput.oninput = () => {

    document.getElementById("mod-email").value.trim(),

    document.getElementById("mod-reason").value

    document.getElementById("trust-email").value.trim(),
    document.getElementById("trust-level").value
  );
}

function wireToolsActions() {
  const bcBtn = document.getElementById("send-broadcast-btn");
  if (bcBtn) bcBtn.onclick = () => sendBroadcast(
    document.getElementById("bc-title").value,
    document.getElementById("bc-body").value,
    document.getElementById("bc-skills").value,
    document.getElementById("bc-email").checked
  );
  const creditBtn = document.getElementById("credit-wallet-btn");
  if (creditBtn) creditBtn.onclick = () => creditWallet(
    document.getElementById("credit-email").value.trim(),
    document.getElementById("credit-amount").value,
    document.getElementById("credit-reason").value
  );
  const pushBtn = document.getElementById("push-test-btn");
  if (pushBtn) pushBtn.onclick = runPushDiagnosticsTest;
  const editTrancheBtn = document.getElementById("edit-tranche-btn");
  if (editTrancheBtn) editTrancheBtn.onclick = () => {
    const amount = document.getElementById("edit-tranche-amount").value;
    const label = document.getElementById("edit-tranche-label").value;
    const changes = {};
    if (amount) changes.amountKobo = Math.round(Number(amount) * 100);
    if (label) changes.label = label;
    adminEditTranche(
      document.getElementById("edit-tranche-agreement").value.trim(),
      document.getElementById("edit-tranche-tranche").value.trim(),
      changes,
      document.getElementById("edit-tranche-reason").value
    );
  };

  const editAgreementBtn = document.getElementById("edit-agreement-btn");
  if (editAgreementBtn) editAgreementBtn.onclick = () => {
    const title = document.getElementById("edit-agreement-title").value;
    const description = document.getElementById("edit-agreement-description").value;
    const amount = document.getElementById("edit-agreement-amount").value;
    const changes = {};
    if (title) changes.title = title;
    if (description) changes.description = description;
    if (amount) changes.amountKobo = Math.round(Number(amount) * 100);
    adminEditAgreement(
      document.getElementById("edit-agreement-id").value.trim(),
      changes,
      document.getElementById("edit-agreement-reason").value
    );
  };

  const forceCancelBtn = document.getElementById("force-cancel-btn");
  if (forceCancelBtn) forceCancelBtn.onclick = () => {
    let decisions;
    try {
      decisions = JSON.parse(document.getElementById("force-cancel-decisions").value || "{}");
    } catch (e) {
      toast("Decisions must be valid JSON.", "error");
      return;
    }
    if (!confirm("Force-cancel this deal? This cannot be undone.")) return;
    adminForceCancelDeal(
      document.getElementById("force-cancel-agreement").value.trim(),
      decisions,
      document.getElementById("force-cancel-reason").value
    );
  };
}

let listingsSearchDebounce = null;
function wireListingsActions() {
  const searchInput = document.getElementById("listings-search-input");
  if (searchInput) {
    searchInput.oninput = () => {
      state.listingsQuery = searchInput.value;
      clearTimeout(listingsSearchDebounce);
      listingsSearchDebounce = setTimeout(searchListings, 300);
    };
  }
  document.querySelectorAll("[data-listing-type-toggle]").forEach((b) => {
    b.onclick = () => {
      const t = b.dataset.listingTypeToggle;
      if (state.listingsTypes.has(t)) state.listingsTypes.delete(t); else state.listingsTypes.add(t);
      searchListings();
    };
  });
  document.querySelectorAll("[data-delete-post]").forEach((b) => {
    b.onclick = () => {
      const [type, id] = b.dataset.deletePost.split("|");
      if (confirm("Remove this post permanently?")) deleteListingPost(type, id);
    };
  });
}

function render() {
  if (state.view === "login") return renderLogin();
  if (state.view === "mfa-enroll") return renderMfaEnroll();
  if (state.view === "mfa-challenge") return renderMfaChallenge();
  if (state.view === "dashboard") return renderDashboard();
  app.innerHTML = `<div class="center-screen"><div class="muted">Loading...</div></div>`;
}

sb.auth.onAuthStateChange((_event, _session) => {
  // Re-derive from getSession() inside refreshAuthState rather than trusting
  // this callback's own session payload, so AAL is always freshly checked.
  if (state.view !== "loading") refreshAuthState();
});

render();
refreshAuthState();
</script>
