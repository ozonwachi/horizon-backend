# Every function does its own auth (see supabase/functions/_shared/auth.ts)
# instead of relying on the platform's JWT gate, so verify_jwt is false
# across the board - webhooks needs this (Paystack sends no Supabase JWT
# at all), and the rest match it for one consistent auth model instead of
# mixing platform-level and application-level auth.
[functions.escrow]
verify_jwt = false

[functions.wallet]
verify_jwt = false

[functions.conversations]
verify_jwt = false

[functions.referrals]
verify_jwt = false

[functions.jobs]
verify_jwt = false

[functions.admin]
verify_jwt = false

[functions.webhooks]
verify_jwt = false

[functions.barter]
verify_jwt = false

[functions.account]
verify_jwt = false

# share needs this for a different reason than the rest: its pages are
# meant to be open to literally anyone who taps a shared link, logged in or
# not - there's no auth to enforce at all here, application-level or
# otherwise (see supabase/functions/share/index.ts).
[functions.share]
verify_jwt = false
